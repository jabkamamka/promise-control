<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль обещаний — панель оператора</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --ink: #16202c;
    --muted: #6b7788;
    --line: #e3e8f0;
    --accent: #2f6fed;
    --created: #2f6fed;
    --progress: #b26a00;
    --done: #1f8a54;
    --overdue: #c9382f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 18px 28px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  main { padding: 22px 28px 60px; max-width: 1280px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 26px; font-weight: 650; margin-top: 4px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  button, select {
    font: inherit; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.small { padding: 5px 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .b-created { color: var(--created); background: #e8effd; }
  .b-in_progress { color: var(--progress); background: #fdf1dc; }
  .b-done { color: var(--done); background: #e3f5eb; }
  .b-overdue { color: var(--overdue); background: #fde8e6; }
  .quote { color: var(--muted); font-size: 13px; max-width: 420px; }
  .type { font-weight: 600; }
  .due { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Сервис контроля обещаний</h1>
  <span class="sub">панель оператора · <a href="/docs">Swagger API</a></span>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button data-status="" class="active">Все</button>
    <button data-status="created">Создана</button>
    <button data-status="in_progress">В работе</button>
    <button data-status="overdue">Просрочена</button>
    <button data-status="done">Выполнена</button>
    <span style="flex:1"></span>
    <select id="operator"><option value="">Все операторы</option></select>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:56px">#</th>
        <th style="width:230px">Обещание</th>
        <th style="width:110px">Статус</th>
        <th style="width:170px">Срок</th>
        <th>Цитата из звонка</th>
        <th style="width:190px"></th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">Загрузка…</td></tr></tbody>
  </table>

  <footer>Данные обновляются автоматически каждые 15 секунд. Просроченные задачи выставляет сервер.</footer>
</main>

<script>
const state = { status: "", operator: "" };

const STATUS = {
  created: ["Создана", "b-created"],
  in_progress: ["В работе", "b-in_progress"],
  done: ["Выполнена", "b-done"],
  overdue: ["Просрочена", "b-overdue"],
};

function fmt(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

async function loadStats() {
  const s = await (await fetch("/stats")).json();
  const cards = [
    ["Звонков", s.calls_total],
    ["Задач", s.tasks_total],
    ["Создано", s.by_status["Создана"] || 0],
    ["В работе", s.by_status["В работе"] || 0],
    ["Просрочено", s.by_status["Просрочена"] || 0],
    ["Выполнено", s.by_status["Выполнена"] || 0],
  ];
  document.getElementById("stats").innerHTML = cards
    .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`)
    .join("");
}

async function loadTasks() {
  const params = new URLSearchParams({ limit: "100", sort: "due_at" });
  if (state.status) params.set("status", state.status);
  if (state.operator) params.set("operator_id", state.operator);
  const data = await (await fetch("/tasks?" + params)).json();

  const rows = document.getElementById("rows");
  if (!data.items.length) {
    rows.innerHTML = '<tr><td colspan="6" class="empty">Задач с такими условиями нет</td></tr>';
    return;
  }
  rows.innerHTML = data.items.map(task => {
    const [label, cls] = STATUS[task.status] || [task.status, "b-created"];
    const actions = [];
    if (task.status === "created" || task.status === "overdue") {
      actions.push(`<button class="small" data-act="in_progress" data-id="${task.id}">В работу</button>`);
    }
    if (task.status !== "done") {
      actions.push(`<button class="small" data-act="done" data-id="${task.id}">Выполнено</button>`);
    }
    return `<tr>
      <td>${task.id}</td>
      <td class="type">${task.title}</td>
      <td><span class="badge ${cls}">${label}</span></td>
      <td class="due">${fmt(task.due_at)}</td>
      <td class="quote">«${task.quote}»${task.due_phrase ? `<br><span style="font-size:12px">срок: ${task.due_phrase}</span>` : ""}</td>
      <td><div class="actions">${actions.join("")}</div></td>
    </tr>`;
  }).join("");

  rows.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      await fetch(`/tasks/${btn.dataset.id}/status`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: btn.dataset.act, note: "Изменено в панели оператора" }),
      });
      await refresh();
    });
  });
}

async function loadOperators() {
  const data = await (await fetch("/tasks?limit=500")).json();
  const ids = [...new Set(data.items.map(t => t.operator_id).filter(Boolean))].sort();
  const select = document.getElementById("operator");
  select.innerHTML = '<option value="">Все операторы</option>' +
    ids.map(id => `<option value="${id}">${id}</option>`).join("");
}

async function refresh() {
  await Promise.all([loadStats(), loadTasks()]);
}

document.querySelectorAll("button[data-status]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("button[data-status]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.status = btn.dataset.status;
    loadTasks();
  });
});

document.getElementById("operator").addEventListener("change", e => {
  state.operator = e.target.value;
  loadTasks();
});

(async () => {
  await loadOperators();
  await refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
